name: Deploy landing page

# The marketing one-pager in site/ is plain static HTML with no build step.
# The app itself is NOT deployed here: it needs a server for auth and the
# database, so it belongs on Vercel.
on:
  push:
    # Deliberately no branch filter. The deploy job below gates on the
    # repository's own default branch instead, so this keeps working if the
    # default branch is ever renamed — hard-coding "main" here meant the
    # workflow never fired at all while the default branch was named
    # something else.
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only the default branch publishes. A push to a feature branch that
    # touches site/ is skipped rather than overwriting the live page.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be enabled for the repository, with its source set
      # to GitHub Actions. This step cannot do it: configure-pages has an
      # `enablement: true` option, but creating a Pages site needs repository
      # administration rights that the workflow's GITHUB_TOKEN does not have,
      # and it fails with "Resource not accessible by integration".
      # See site/README.md for the one-time setup.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
